<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom Auto-Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --surface: #161a23;
      --surface2: #1e2332;
      --border: rgba(255,255,255,0.07);
      --accent: #4f8ef7;
      --accent-glow: rgba(79,142,247,0.25);
      --success: #34d399;
      --danger: #f87171;
      --text: #e8ecf4;
      --muted: #6b7590;
      --radius: 10px;
    }

    body {
      width: 360px;
      min-height: 480px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0d1220 0%, #131827 100%);
    }
    .header-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px var(--accent-glow);
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      flex: 1; padding: 10px 0; text-align: center;
      cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 500;
      transition: color .15s, border-bottom .15s;
      border-bottom: 2px solid transparent;
      user-select: none;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panels ── */
    .panel { display: none; padding: 14px 16px; }
    .panel.active { display: block; }

    /* ── Form ── */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
    input, select {
      width: 100%; padding: 8px 10px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: inherit; font-size: 13px;
      outline: none; transition: border .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input::placeholder { color: var(--muted); }
    select option { background: var(--surface2); }

    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }

    .recurring-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 10px; cursor: pointer;
    }
    .recurring-row input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
    .recurring-row span { font-size: 12px; }

    .btn {
      width: 100%; padding: 9px; border: none; border-radius: var(--radius);
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 10px var(--accent-glow); }
    .btn-primary:hover { opacity: .9; }

    /* ── Meetings List ── */
    .meetings-list { display: flex; flex-direction: column; gap: 8px; }
    .empty-state {
      text-align: center; padding: 32px 16px; color: var(--muted);
    }
    .empty-state .big { font-size: 28px; margin-bottom: 8px; }
    .empty-state p { font-size: 12px; line-height: 1.5; }

    .meeting-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 12px;
      display: flex; align-items: flex-start; gap: 10px;
      animation: slideIn .2s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    .meeting-dot {
      width: 8px; height: 8px; border-radius: 50%; margin-top: 4px;
      background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); flex-shrink: 0;
    }
    .meeting-dot.past { background: var(--muted); box-shadow: none; }

    .meeting-info { flex: 1; min-width: 0; }
    .meeting-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meeting-meta { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .meeting-badge {
      font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
      background: rgba(79,142,247,.15); color: var(--accent);
      border: 1px solid rgba(79,142,247,.25); border-radius: 4px; padding: 1px 5px;
      margin-left: 6px; vertical-align: middle;
    }

    .btn-icon {
      width: 26px; height: 26px; border: none; border-radius: 6px;
      background: transparent; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
      transition: background .15s, color .15s; flex-shrink: 0;
    }
    .btn-icon:hover { background: rgba(248,113,113,.12); color: var(--danger); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%) translateY(40px);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; padding: 7px 14px;
      border-radius: 20px; opacity: 0; transition: all .25s ease;
      white-space: nowrap; pointer-events: none; z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(52,211,153,.3); color: var(--success); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🎥</div>
    <div>
      <div class="header-title">Zoom Auto-Launcher</div>
      <div class="header-sub">Never miss a meeting again</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="add">＋ Add Meeting</div>
    <div class="tab" data-tab="meetings">My Meetings</div>
  </div>

  <!-- Add Meeting Panel -->
  <div class="panel active" id="panel-add">
    <div class="form-group">
      <label>Meeting Name</label>
      <input type="text" id="meetingName" placeholder="e.g. Weekly Standup" maxlength="60" />
    </div>
    <div class="form-group">
      <label>Zoom Link</label>
      <input type="url" id="meetingUrl" placeholder="https://zoom.us/j/..." />
    </div>
    <div class="row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="meetingDate" />
      </div>
      <div class="form-group">
        <label>Time</label>
        <input type="time" id="meetingTime" />
      </div>
    </div>
    <div class="form-group">
      <label class="recurring-row">
        <input type="checkbox" id="isRecurring" />
        <span>Repeat weekly on this day</span>
      </label>
    </div>
    <div class="form-group">
      <label>Reminder (mins before)</label>
      <select id="reminderOffset">
        <option value="0">At meeting time</option>
        <option value="2">2 minutes before</option>
        <option value="5" selected>5 minutes before</option>
        <option value="10">10 minutes before</option>
        <option value="15">15 minutes before</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btnSave">Schedule Meeting</button>
  </div>

  <!-- Meetings Panel -->
  <div class="panel" id="panel-meetings">
    <div class="meetings-list" id="meetingsList"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
